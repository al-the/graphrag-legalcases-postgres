# GraphRAG configuration for Malaysian Knowledge Graph
# Ref: graphrag/packages/graphrag/graphrag/config/models/

encoding_model: o200k_base
skip_workflows: []

llm:
  api_key: ${AZURE_OPENAI_API_KEY}
  type: azure_openai_chat
  model: gpt-4o
  api_base: ${AZURE_OPENAI_ENDPOINT}
  api_version: ${AZURE_OPENAI_API_VERSION:2024-02-01}
  deployment_name: ${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4o}
  tokens_per_minute: 80000
  requests_per_minute: 480
  max_retries: 10
  max_retry_wait: 10
  sleep_on_rate_limit_recommendation: true
  concurrent_requests: 25

parallelization:
  stagger: 0.3
  num_threads: 50

async_mode: threaded

embeddings:
  async_mode: threaded
  llm:
    api_key: ${AZURE_OPENAI_API_KEY}
    type: azure_openai_embedding
    model: text-embedding-3-small
    api_base: ${AZURE_OPENAI_ENDPOINT}
    api_version: ${AZURE_OPENAI_API_VERSION:2024-02-01}
    deployment_name: ${AZURE_OPENAI_EMBED_DEPLOYMENT:text-embedding-3-small}
    tokens_per_minute: 350000
    requests_per_minute: 2100
    max_retries: 10
    batch_size: 16
    max_tokens: 8191
  batch_size: 16
  batch_max_tokens: 8191
  target: required

chunks:
  size: 1200
  overlap: 200
  group_by_columns: [id]

input:
  type: file
  file_type: text
  base_dir: input
  file_encoding: utf-8
  file_pattern: ".*\\.txt$"

cache:
  type: file
  base_dir: cache

storage:
  type: file
  base_dir: output

reporting:
  type: file
  base_dir: logs

entity_extraction:
  prompt: prompts/extract_graph_my.txt
  entity_types:
    - ORGANIZATION
    - PERSON
    - LAW
    - REGULATION
    - FINANCIAL_INSTRUMENT
    - LOCATION
    - DATE
    - EVENT
    - METRIC
    - MINISTRY
    - COMMITTEE
  max_gleanings: 2

summarize_descriptions:
  prompt: prompts/summarize_descriptions_my.txt
  max_length: 500

claim_extraction:
  enabled: false

community_reports:
  prompt: prompts/community_report_my.txt
  max_length: 2000
  max_input_length: 8000

cluster_graph:
  max_cluster_size: 10

embed_graph:
  enabled: false

umap:
  enabled: false

snapshots:
  graphml: false
  raw_entities: false
  top_level_nodes: false

local_search:
  text_unit_prop: 0.5
  community_prop: 0.15
  conversation_history_max_turns: 5
  top_k_entities: 10
  top_k_relationships: 10
  max_tokens: 12000

global_search:
  max_tokens: 12000
  data_max_tokens: 12000
  map_max_tokens: 1000
  reduce_max_tokens: 2000
  concurrency: 32
